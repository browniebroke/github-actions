name: Lint Typescript Project

on:
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - format
          - types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: "npm"
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run check:${{ matrix.check }}
